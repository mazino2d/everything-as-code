name: Terraform

# Pull requests plan every changed stack (sticky PR comment per stack); main
# applies them; a manual run applies the chosen stack(s). State and each
# stack's variables live in gs://mazino2d-as-se1-eac-tfstate; jobs sign in
# keylessly as a service account of the project a stack manages
# (mazino2d-as-se1-eac for stacks outside GCP; the k8s stack uses
# mazino2d-as-se1-dev, which owns the cluster's project). Applies run as
# terraform@, which only main may use; plans run as the read-only
# terraform-plan@, without the state lock.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      stack:
        description: Terraform stack to apply
        required: true
        default: all
        type: choice
        options:
          - all
          - terraform/github
          - terraform/gcp/mazino2d-as-se1-eac
          - terraform/gcp/mazino2d-as-se1-dev
          - terraform/gcp/simsplit-as-se1-prd
          - terraform/gcp/simsplit-as-se1-dev
          - terraform/gcp/dataplatform-as-se1-prd
          - terraform/gcp/dataplatform-as-se1-dev
          - terraform/cloudflare
          - terraform/infisical
          - terraform/grafana/stack
          - terraform/grafana/dashboard
          - terraform/k8s/mazino2d-as-se1-dev

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform:
    uses: mazino2d/github-workflows/.github/workflows/terraform.yml@v1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      mode: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
      select: ${{ inputs.stack || '' }}
      gcp-workload-identity-provider: projects/725985974531/locations/global/workloadIdentityPools/github/providers/everything-as-code
      gcp-service-account: terraform@mazino2d-as-se1-eac.iam.gserviceaccount.com
      gcp-service-accounts: >-
        {
          "terraform/gcp/mazino2d-as-se1-dev": "terraform@mazino2d-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/simsplit-as-se1-dev": "terraform@simsplit-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/simsplit-as-se1-prd": "terraform@simsplit-as-se1-prd.iam.gserviceaccount.com",
          "terraform/gcp/dataplatform-as-se1-dev": "terraform@dataplatform-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/dataplatform-as-se1-prd": "terraform@dataplatform-as-se1-prd.iam.gserviceaccount.com",
          "terraform/k8s/mazino2d-as-se1-dev": "terraform@mazino2d-as-se1-dev.iam.gserviceaccount.com"
        }
      gcp-plan-service-account: terraform-plan@mazino2d-as-se1-eac.iam.gserviceaccount.com
      gcp-plan-service-accounts: >-
        {
          "terraform/gcp/mazino2d-as-se1-dev": "terraform-plan@mazino2d-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/simsplit-as-se1-dev": "terraform-plan@simsplit-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/simsplit-as-se1-prd": "terraform-plan@simsplit-as-se1-prd.iam.gserviceaccount.com",
          "terraform/gcp/dataplatform-as-se1-dev": "terraform-plan@dataplatform-as-se1-dev.iam.gserviceaccount.com",
          "terraform/gcp/dataplatform-as-se1-prd": "terraform-plan@dataplatform-as-se1-prd.iam.gserviceaccount.com",
          "terraform/k8s/mazino2d-as-se1-dev": "terraform-plan@mazino2d-as-se1-dev.iam.gserviceaccount.com"
        }
      plan-lock: false
      secrets-uri: gs://mazino2d-as-se1-eac-tfstate/secrets
