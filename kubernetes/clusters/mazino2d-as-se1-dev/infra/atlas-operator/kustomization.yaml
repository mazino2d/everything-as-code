apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: atlas-operator
    repo: oci://ghcr.io/ariga/charts
    version: 0.7.28
    releaseName: atlas-operator
    namespace: atlas-operator
    valuesInline:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
# The chart leaves metadata.namespace off its namespaced objects.
patches:
  - target:
      kind: ServiceAccount|Role|RoleBinding|Deployment
    patch: |-
      - op: add
        path: /metadata/namespace
        value: atlas-operator
resources:
  - namespace.yaml
