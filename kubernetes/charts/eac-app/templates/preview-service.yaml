{{- if and (eq .Values.workload "deployment") (eq .Values.deployment.rollout.strategy "BlueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-preview
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    {{- include "eac-app.servicePorts" (dict "Values" .Values) | trim | nindent 4 }}
{{- end }}
