apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.17.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      installCRDs: true
      global:
        # GKE Autopilot denies writes to kube-system (the chart's default lease namespace).
        leaderElection:
          namespace: cert-manager
resources:
  - namespace.yaml
