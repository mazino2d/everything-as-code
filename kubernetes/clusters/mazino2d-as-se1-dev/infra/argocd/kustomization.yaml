apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: 2.37.7
    releaseName: argo-rollouts
    namespace: argocd
    includeCRDs: true
    valuesInline:
      controller:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      # Rollouts are viewed through the Argo CD rollout-extension instead.
      dashboard:
        enabled: false
resources:
  - namespace.yaml
