# Password for dagster-db-1, re-keyed to the name the dagster chart expects.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: dagster-postgresql-secret
  namespace: apps
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: "60"
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: everything-as-code
        envSlug: dev
        secretsPath: /apps/dagster-db-1
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedKubeSecretReferences:
    - secretName: dagster-postgresql-secret
      secretNamespace: apps
      creationPolicy: Orphan
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          postgresql-password: "{{ .POSTGRES_PASSWORD.Value }}"
---
# Runtime environment for the jaffle-shop code location (MOTHERDUCK_TOKEN).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: jaffle-shop-env
  namespace: apps
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: "60"
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: everything-as-code
        envSlug: dev
        secretsPath: /apps/jaffle-shop
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedKubeSecretReferences:
    - secretName: jaffle-shop-env
      secretNamespace: apps
      creationPolicy: Orphan
      secretType: Opaque
