{{- if eq .Values.workload "statefulset" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.name }}
  ports:
    {{- include "eac-app.servicePorts" (dict "Values" .Values) | trim | nindent 4 }}
{{- end }}
