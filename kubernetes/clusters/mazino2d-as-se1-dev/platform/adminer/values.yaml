name: adminer
image:
  repository: adminer
  tag: 4.8.1-standalone
resources:
  requests:
    cpu: 5m
    memory: 48Mi
  limits:
    memory: 64Mi
env:
  ADMINER_DEFAULT_SERVER: outline-db-1.apps.svc.cluster.local
service:
  ports:
    - port: 8080
      containerPort: 8080
nacl:
  ingress:
    - ambassador/traffic-manager:8080
  egress:
    - apps/outline-db-1:5432
