apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infisical-secrets.yaml
helmCharts:
  - name: dagster
    repo: https://dagster-io.github.io/helm
    version: 1.13.24
    releaseName: dagster
    namespace: apps
    valuesFile: values.yaml
# The upstream chart does not set metadata.namespace, and the namespace
# transformer skips its rendered output, so set it explicitly.
patches:
  - target:
      kind: ServiceAccount|ConfigMap|Service|Deployment
    patch: |-
      - op: add
        path: /metadata/namespace
        value: apps
