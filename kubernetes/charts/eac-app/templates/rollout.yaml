{{- $argoStrategies := list "BlueGreen" "ReplicaCanary" }}
{{- if and (eq .Values.workload "deployment") (has .Values.deployment.rollout.strategy $argoStrategies) }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      {{- include "eac-app.podMetadata" . | nindent 6 }}
    spec:
      {{- include "eac-app.podSpec" . | nindent 6 }}
  strategy:
    {{- if eq .Values.deployment.rollout.strategy "BlueGreen" }}
    blueGreen:
      activeService: {{ .Values.name }}
      previewService: {{ .Values.name }}-preview
      autoPromotionEnabled: {{ .Values.deployment.rollout.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.deployment.rollout.scaleDownDelaySeconds }}
      previewReplicaCount: {{ .Values.deployment.rollout.previewReplicaCount }}
    {{- else if eq .Values.deployment.rollout.strategy "ReplicaCanary" }}
    canary:
      steps:
        {{- toYaml .Values.deployment.rollout.steps | nindent 8 }}
    {{- end }}
{{- end }}
