apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: secrets-operator
    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    version: 0.10.32
    releaseName: infisical-operator
    namespace: infisical-operator
    valuesInline:
      installCRDs: true
# The chart leaves metadata.namespace off its namespaced objects.
patches:
  - target:
      kind: ServiceAccount|Role|RoleBinding|Service|Deployment
    patch: |-
      - op: add
        path: /metadata/namespace
        value: infisical-operator
resources:
  - namespace.yaml
